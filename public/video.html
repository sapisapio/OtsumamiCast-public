<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; media-src 'self' https: blob:; connect-src 'self' https://www.youtube.com https://www.gstatic.com; frame-src https://www.youtube.com; object-src 'none'; base-uri 'self';">
  <title>動画ウィンドウ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #player {
      width: 100%;
      height: 100%;
    }
  </style>
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <div id="player"></div>
  
  <script>
    let player;
    
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: '',
        playerVars: {
          autoplay: 0
        },
        events: {
          'onReady': onPlayerReady
        }
      });
    }
    
    function onPlayerReady() {
      console.log('Video player ready');
      
      // Electronからの同期メッセージを受信
      if (window.electronAPI?.onSyncVideo) {
        window.electronAPI.onSyncVideo((data) => {
          console.log('Received sync:', data);
          
          if (data.action === 'load') {
            player.loadVideoById(data.videoId);
          } else if (data.action === 'play') {
            player.playVideo();
          } else if (data.action === 'pause') {
            player.pauseVideo();
          } else if (data.action === 'seek') {
            player.seekTo(data.time, true);
          }
        });
      }
    }
  </script>
</body>
</html>
