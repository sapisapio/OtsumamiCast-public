<!-- vcast-tab.html -->

<div class="section">
  <div class="section-title">🎭 Vcast（なんちゃってアバター）</div>
  
  <div class="small-text" style="margin-bottom: 20px;">
    オーバーレイの下部に画像を表示し、アニメーションさせることができます
  </div>
</div>

<div class="section">
  <div class="small-text" id="vcastReactionToast" style="margin-top: 8px;"></div>
</div>

<!-- ホスト専用：アバター設定 -->
<div class="section host-only-ui" id="vcastHostSettings">
  <div class="form-group">
    <label style="display: flex; align-items: center;">
      <input type="checkbox" id="vcastEnabled" style="margin-right: 8px;" checked>
      アバター表示を有効化
    </label>
  </div>

  <!-- アバター画像アップロード -->
  <div class="form-group">
    <label>アバター画像</label>
    <input type="file" id="vcastAvatarFile" accept="image/png,image/gif,image/webp" style="display: none;">
    <button class="btn" onclick="document.getElementById('vcastAvatarFile').click();">
      📁 画像を選択
    </button>
    <div class="small-text" style="margin-top: 5px;">
      推奨：PNG（透過対応）、GIF（アニメーション対応）
    </div>
  </div>
  
  <!-- プレビュー -->
  <div class="form-group">
    <label>プレビュー</label>
    <div id="vcastPreview" style="
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      min-height: 150px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
    ">
      <span style="color: #999;">画像を選択するとプレビューが表示されます</span>
    </div>
  </div>
  
  <hr style="margin: 20px 0;">
  
  <!-- アニメーション設定 -->
  <div class="section-title">🎬 アニメーション設定</div>
  
  <div class="form-group">
    <label>待機アニメーション</label>
    <select id="vcastIdleAnimation">
      <option value="none">なし</option>
      <option value="bounce">ふわふわ</option>
      <option value="shake">震える</option>
      <option value="rotate">回転</option>
      <option value="breathe">呼吸</option>
      <option value="tilt">首かしげ</option>
      <option value="micro-rotate">微回転</option>
      <option value="heartbeat">ドキドキ</option>
      <option value="stomp">足元バウンド</option>
    </select>
  </div>
  
  <div class="form-group">
    <label for="vcastAnimationSpeed">速度: <span id="vcastAnimationSpeedValue">1.0</span>x</label>
    <input type="range" id="vcastAnimationSpeed" min="0.5" max="3.0" value="1.0" step="0.1">
  </div>

  <div class="form-group">
    <label for="vcastIdleIntensity">強度: <span id="vcastIdleIntensityValue">100</span>%</label>
    <input type="range" id="vcastIdleIntensity" min="50" max="200" value="100" step="10">
  </div>
  
  <hr style="margin: 20px 0;">
  
  <!-- 音声反応設定 -->
  <div class="section-title">🎤 音声反応</div>
  
  <div class="form-group">
    <label style="display: flex; align-items: center;">
      <input type="checkbox" id="vcastVoiceReaction" style="margin-right: 8px;">
      音声に反応してアニメーション
    </label>
    <div class="small-text">
      マイク入力の音量に応じてアバターが動きます
    </div>
  </div>
  
  <div class="form-group">
    <label for="vcastVoiceSensitivity">感度: <span id="vcastVoiceSensitivityValue">50</span>%</label>
    <input type="range" id="vcastVoiceSensitivity" min="0" max="100" value="50" step="1">
  </div>

  <div class="form-group">
    <label for="vcastVoiceThreshold">しきい値: <span id="vcastVoiceThresholdValue">50</span></label>
    <input type="range" id="vcastVoiceThreshold" min="10" max="200" value="50" step="1">
  </div>

  <div class="form-group">
    <label for="vcastMicIntensity">アニメ強度: <span id="vcastMicIntensityValue">100</span>%</label>
    <input type="range" id="vcastMicIntensity" min="50" max="200" value="100" step="10">
  </div>

  <div class="form-group">
    <label for="vcastMicDevice">マイクデバイス</label>
    <select id="vcastMicDevice"></select>
  </div>

  <div class="form-group">
    <label for="vcastMicAnimation">音声アニメーション</label>
    <select id="vcastMicAnimation">
      <option value="none">なし</option>
      <option value="bounce">上下バウンス</option>
      <option value="nod">首振り</option>
      <option value="glow">アウトライン発光</option>
      <option value="ripple">リップル波紋</option>
      <option value="bright">明るさ変化</option>
      <option value="scale">拡大</option>
    </select>
  </div>

  <div class="form-group">
    <label>音量</label>
    <div style="background: #eee; border-radius: 6px; height: 8px; overflow: hidden;">
      <div id="vcastMicLevelBar" style="height: 100%; width: 0%; background: #4caf50;"></div>
    </div>
  </div>
  
  <hr style="margin: 20px 0;">
  
  <!-- 表示設定 -->
  <div class="section-title">📐 表示設定</div>
  
  <div class="form-group">
    <label for="vcastSize">サイズ: <span id="vcastSizeValue">150</span>px</label>
    <input type="range" id="vcastSize" min="50" max="500" value="150" step="10">
  </div>
  
  <div class="form-group">
    <label for="vcastPosition">位置</label>
    <select id="vcastPosition">
      <option value="bottom-left">左下</option>
      <option value="bottom-center">中央下</option>
      <option value="bottom-right">右下</option>
    </select>
  </div>
  
</div>

<!-- リスナー用：表示のみ -->
<div class="section viewer-only-ui">
  <div class="small-text" style="color: #888; text-align: center; padding: 40px;">
    この機能はホストのみ設定できます
  </div>
</div>

<!-- 固定保存ボタン（ホスト専用） -->
<button class="fixed-save-btn host-only-ui" id="saveVcastBtn">✓ 適用</button>
